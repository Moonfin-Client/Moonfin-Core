org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.builtInKotlin=false
android.newDsl=false
# flutter_inappwebview_android 1.1.3 still asks for proguard-android.txt, which
# AGP 9 rejects. Only the plugin's consumer rules reach the app's R8 pass, so
# allowing it changes nothing in the shipped build. Drop this once
# flutter_inappwebview 6.2 is stable.
android.r8.proguardAndroidTxt.disallowed=false

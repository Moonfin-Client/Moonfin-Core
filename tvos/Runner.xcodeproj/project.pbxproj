			name = "Embed Flutter.framework";
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "#!/bin/sh\n# Embed + code-sign the Flutter engine into the app bundle.\n#\n# flutter-tvos stages the engine at tvos/Flutter/Flutter.framework on every\n# build/run, and the Runner scheme's \"Prepare Flutter framework\" pre-action\n# copies it into BUILT_PRODUCTS_DIR so the Swift package targets can compile\n# against it. Neither of those puts it in the bundle -- this phase does,\n# mirroring what upstream Flutter's xcode_backend does for iOS. Runs for build,\n# run, AND archive, so TestFlight/App Store builds get it too.\n#\n# Headers and Modules are compile-time only. Xcode's own framework embed strips\n# them, so strip them here too rather than shipping them inside every app.\n#\n# Sign the embedded engine with the app's own identity, the same thing upstream\n# Flutter does to the engine it copies -- a framework that reaches the bundle\n# unsigned fails to load. This is NOT what satisfies Apple's ITMS-91065 check:\n# that needs a Developer ID signature on the engine BEFORE this phase embeds\n# it, which flutter-tvos applies to its artifact cache on every device build.\n#\n# Use CODESIGNING_FOLDER_PATH (the bundle being signed), not ${PRODUCT_NAME}.app,\n# which is wrong whenever the product name is overridden.\nFRAMEWORK_SRC=\"${PROJECT_DIR}/Flutter/Flutter.framework\"\nDEST_FRAMEWORKS=\"${CODESIGNING_FOLDER_PATH}/Frameworks\"\nif [ ! -d \"${FRAMEWORK_SRC}\" ]; then\n  echo \"error: ${FRAMEWORK_SRC} does not exist, so this build would ship without a Flutter engine. Run 'flutter-tvos build tvos' (or 'flutter-tvos run') for this configuration first, then build again.\"\n  exit 1\nfi\necho \"Embedding Flutter.framework...\"\nmkdir -p \"${DEST_FRAMEWORKS}\"\nrsync -a --delete --filter \"- Headers\" --filter \"- Modules\" \"${FRAMEWORK_SRC}\" \"${DEST_FRAMEWORKS}/\"\nif [ \"${CODE_SIGNING_REQUIRED}\" = \"NO\" ] || [ -z \"${EXPANDED_CODE_SIGN_IDENTITY}\" ]; then\n  echo \"Skipping Flutter.framework signing (code signing not required for this build).\"\nelse\n  echo \"Codesigning Flutter.framework with ${EXPANDED_CODE_SIGN_IDENTITY}...\"\n  codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --timestamp=none --generate-entitlement-der \"${DEST_FRAMEWORKS}/Flutter.framework\"\nfi\n";
		};

name: moonfin
description: "Moonfin - Jellyfin & Emby media client for mobile, tablet, and desktop"
publish_to: 'none'
version: 2.5.1+30000149

moonfin:
  android_tv_version: 2.5.1
  android_tv_build_number: 2000016

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^17.2.2
  # moonfin:// deep links on Android, iOS, macOS, Windows and Linux
  app_links: ^7.2.1
  animated_reorderable_list: ^1.3.0

  # State Management & DI
  get_it: ^9.2.1
  injectable: ^2.5.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.11.1
  dio_cookie_manager: ^3.4.0
  background_downloader: ^9.6.0
  ffi: ^2.1.0
  cookie_jar: ^4.0.9
  web_socket_channel: ^3.0.3

  # Local Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.6.0
  sqlite3: ^2.7.0

  # Media Playback (Android, desktop and web. Apple runs on AetherEngine)
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  # media_kit_libs_video would pull in the Apple libs packages, and
  # media_kit_video's podspecs link -framework Mpv whenever they find one in
  # pubspec.lock. Two FFmpeg builds in one binary let the engine bind a call
  # to the wrong one, which aborts playback, so Apple keeps libmpv out
  # entirely. The platforms that need it are listed individually instead.
  media_kit_libs_android_video: 1.3.8
  media_kit_libs_windows_video: 1.0.12
  media_kit_libs_linux: 1.2.1

  # Image Loading
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  # Direct because the image cache wraps the cache manager's file service in a
  # client of its own. Keep in step with what flutter_cache_manager resolves.
  http: ^1.6.0
  flutter_svg: ^2.2.1

  # Crypto
  crypto: ^3.0.6

  # Connectivity
  connectivity_plus: ^7.1.1

  # Gamepad UI navigation on desktop and iOS. Android is left out on purpose,
  # because this plugin's setup wants to override the same Activity methods
  # MainActivity already uses for the emulator, and pads there already arrive
  # as key events anyway.
  #
  # Raw input stream only. The companion flutter_gamepads widget layer isn't
  # used, since it drops input when nothing has focus and can't repeat a held
  # direction. See GamepadNavigationScope.
  gamepads: ^0.1.10

  # Notifications
  flutter_local_notifications: ^21.0.0
  audio_service: ^0.18.18
  audio_session: ^0.2.3
  rxdart: ^0.28.0
  # Linux desktop MPRIS media controls
  dbus: ^0.7.14

  # Utilities
  device_info_plus: ^11.5.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  logger: ^2.7.0
  intl: ^0.20.2
  punycoder: ^0.3.0
  collection: ^1.19.1
  package_info_plus: ^8.3.1
  uuid: ^4.5.3
  cupertino_icons: ^1.0.9
  # Direct because restoring a window needs the work areas of the attached
  # displays to keep it on screen. Keep in step with what window_manager, which
  # already pulls it in, resolves.
  screen_retriever: ^0.2.0
  window_manager: ^0.5.1

  # Local packages
  server_core:
    path: packages/server_core
  server_jellyfin:
    path: packages/server_jellyfin
  server_emby:
    path: packages/server_emby
  playback_core:
    path: packages/playback_core
  playback_jellyfin:
    path: packages/playback_jellyfin
  playback_emby:
    path: packages/playback_emby
  moonfin_design:
    path: packages/design
  jellyfin_preference:
    path: packages/preference
  moonfin_native_video:
    path: packages/moonfin_native_video
  url_launcher: ^6.3.2
  file_picker: ^11.0.2
  webview_flutter: ^4.13.1
  flutter_inappwebview: ^6.1.5
  webview_win_floating: ^3.0.3
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.25.1
  youtube_player_iframe: ^6.0.0
  pdfrx: ^2.6.1
  flutter_widget_from_html_core: ^0.16.1
  # Vendored fork of kindle_unpack 0.1.1 (MOBI/AZW/AZW3 -> EPUB), patched to
  # build against archive 4.x. See packages/kindle_unpack and the patch note.
  kindle_unpack:
    path: packages/kindle_unpack
  archive: ^4.2.0
  rar:
    path: packages/rar_fork
  archive_extract:
    path: packages/archive_extract
  screen_brightness_platform_interface: ^2.1.0
  screen_brightness_android: ^2.1.3
  screen_brightness_ios: ^2.1.2
  wakelock_plus: ^1.3.3
  volume_controller: ^3.6.1
  web: ^1.1.1
  custom_tv_text_field:
    path: packages/custom_tv_text_field_fork
  speech_to_text: ^7.3.0
  qr_flutter: ^4.1.0

  # 1.1.1 fixed a startup race where the configure call could be silently
  # lost, leaving the engine's aggressive default remote tuning active.
  flutter_tvos: ^1.1.2
  path_provider_tvos: any
  shared_preferences_tvos: any
  flutter_secure_storage_tvos: any
  sqflite_tvos: any
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  pointer_interceptor: ^0.10.1+2
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  injectable_generator: ^2.7.0
  riverpod_generator: ^2.6.4
  drift_dev: ^2.28.0
  mocktail: ^1.0.5
  msix: ^3.16.12
  wakelock_plus_platform_interface: ^1.5.1
  # Lets a test stand in for the Android side of path_provider.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

dependency_overrides:
  # objective_c 9.3.0's build hook imports a private path out of
  # native_toolchain_c, which stopped compiling on the Flutter 3.47 SDK and takes
  # `flutter test` down with it. 9.4.1 drops that import.
  objective_c: ^9.4.1
  media_kit_libs_android_video:
    path: packages/media_kit_libs_android_video_full
  # Fork of 1.0.12 keeping shinchiro's newer libmpv over the media-kit archives,
  # which build with a decoder allowlist that leaves out pgssub and so listed
  # PGS tracks that could never render. Also carries the ARM64 ANGLE build and
  # the libc++ it links, neither of which upstream ships. Meant to go upstream,
  # so drop this once a published version covers it.
  media_kit_libs_windows_video:
    git:
      url: https://github.com/RadicalMuffinMan/media-kit.git
      path: libs/windows/media_kit_libs_windows_video
      ref: 43368ec394dcce7795707358b751a748c1fdc610
  # Vendored 0.6.0 with a Windows texture_bridge.cc fix for scroll/resize and
  # tab-switch crashes (null-visual guard + WGC Recreate moved off the
  # capture-thread mutex). The delta is recorded in
  # patches/flutter_inappwebview_windows-0.6.0-texture_bridge.patch; on upgrade,
  # re-vendor the matching version and re-apply that patch.
  flutter_inappwebview_windows:
    path: packages/flutter_inappwebview_windows
  # Vendored 0.1.2 that degrades instead of throwing from its detached input
  # thread, which aborted the app at startup when /dev/input was missing or
  # could not be watched. The delta is recorded in
  # patches/gamepads_linux-0.1.2-no-abort-on-input-errors.patch. On upgrade,
  # re-vendor the matching version and re-apply that patch.
  gamepads_linux:
    path: packages/gamepads_linux
  # Fork of 9.6.0 whose desktop finalize renames the staged download onto its
  # destination instead of copying it, falling back to copy across volumes.
  # With staging configured onto the destination volume this makes completion
  # instant instead of a full second copy of the file. Also widens the
  # connectivity_plus bound to allow the v7 the app already uses. The delta is
  # recorded in patches/background_downloader-9.6.0-desktop-rename-finalize.patch.
  # Meant to go upstream, so drop this once a published version carries it.
  background_downloader:
    git:
      url: https://github.com/RadicalMuffinMan/background_downloader.git
      ref: e4d6fe85387195b972ff9d79a907d540f294b4e7
  # Fork of 2.0.1 carrying a Linux renderer fix: an EGLImage that NVIDIA leaves
  # idle under Wayland stops presenting, so a long gap between mpv frames
  # rebuilds the texture, and frame notifications move onto the main thread.
  # The pinned commit sits ahead of the published release, so it also carries
  # unreleased upstream work on the Apple and Dart sides. Re-check those builds
  # when moving the ref, and drop this once the fix reaches a published version.
  media_kit_video:
    git:
      url: https://github.com/RadicalMuffinMan/media-kit.git
      path: media_kit_video
      ref: 43368ec394dcce7795707358b751a748c1fdc610
  synchronized: 3.3.1
  wakelock_plus: 1.3.3
  screen_brightness_android: 2.1.3
  screen_brightness_ios: 2.1.2
  screen_brightness_platform_interface: 2.1.0
  volume_controller: 3.6.1
  universal_platform: 1.1.0
  plugin_platform_interface: 2.1.8
  web: 1.1.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/ratings/
    - assets/fonts/
    - assets/subtitle_fonts/
    - assets/licenses/cores/

  fonts:
    - family: NeonPulseDisplay
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
    - family: NeonPulseBody
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
    - family: EightBitHero
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf

msix_config:
  display_name: Moonfin
  publisher_display_name: Moonfin
  identity_name: com.moonfin.app
  msix_version: 2.5.1.0
  logo_path: assets/icons/app_icon.png
  capabilities: internetClient, internetClientServer
  languages: en-us

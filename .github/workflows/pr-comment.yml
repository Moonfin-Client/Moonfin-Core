name: PR Comment

# Posts one build-status comment on a pull request and rewrites it in place on
# every new commit. It runs on workflow_run rather than pull_request so it still
# has write access on pull requests from forks. It never checks out the PR
# branch, it only reads the results artifact the build workflow uploaded.

on:
  workflow_run:
    workflows: [Build All Platforms]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')

    steps:
      - name: Download build results
        uses: actions/download-artifact@v4
        with:
          name: build-results
          path: build-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Missing when the tests job died before uploading, the comment still
      # posts and says the run needs a look.
      - name: Download test results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const outcomes = JSON.parse(fs.readFileSync('build-results/outcomes.json', 'utf8'));

            let tests = null;
            try {
              tests = JSON.parse(fs.readFileSync('test-results/test-results.json', 'utf8'));
            } catch (_) {}

            // The artifact was produced by the pull request's own code, so
            // numbers are clamped and names are escaped before they reach a
            // comment posted with the repository's token.
            const clamp = (n) => Number.isFinite(Number(n)) ? Math.max(0, Math.floor(Number(n))) : 0;
            const escapeText = (value) => String(value)
              .replace(/[`\r\n|]/g, ' ')
              .replace(/@/g, '@\u200b')
              .slice(0, 200);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.payload.workflow_run.id;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${runId}`;

            const { data: list } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: runId,
              per_page: 100,
            });
            const artifacts = new Map(list.artifacts.map(a => [a.name, a]));

            const rows = [
              { platform: 'Android',       job: 'android',       artifact: 'android',              files: 'Moonfin_Android_v* + Moonfin_AndroidTV_v*' },
              { platform: 'iOS',           job: 'ios',           artifact: 'ios-ipa',              files: 'Moonfin_iOS_v*_unsigned.ipa' },
              { platform: 'macOS',         job: 'macos',         artifact: 'macos-dmg',            files: 'Moonfin_macOS_v*.dmg' },
              { platform: 'tvOS',          job: 'tvos',          artifact: 'tvos-ipa',             files: 'Moonfin_tvOS_v*_unsigned.ipa' },
              { platform: 'Windows x64',   job: 'windows',       artifact: 'windows-exe',          files: 'Moonfin_Windows_v*.exe' },
              { platform: 'Windows ARM64', job: 'windows_arm64', artifact: 'windows-arm64-exe',    files: 'Moonfin_WindowsARM64_v*.exe' },
              { platform: 'Linux x64',     job: 'linux',         artifact: 'linux-packages-x64',   files: 'Moonfin_Linux_v* (deb/rpm/AppImage/snap/flatpak/tar.gz)' },
              { platform: 'Linux ARM64',   job: 'linux',         artifact: 'linux-packages-arm64', files: 'Moonfin_LinuxARM64_v* (deb/rpm/AppImage/snap/flatpak/tar.gz)' },
            ];

            // Linux builds both architectures in one matrix job, so a failure on
            // either one fails the job as a whole. An artifact only uploads when
            // its own leg got that far, so its presence is what tells the two apart.
            const statusOf = (row) => {
              const result = outcomes[row.job];
              return result === 'success' || artifacts.has(row.artifact) ? 'success' : result;
            };

            const badge = { success: '✅ Passed', failure: '❌ Failed' };

            const artifactCell = (row) => {
              const artifact = artifacts.get(row.artifact);
              return artifact ? `[${row.files}](${runUrl}/artifacts/${artifact.id})` : 'n/a';
            };

            const statuses = rows.map(statusOf);
            const buildsPassed = statuses.every(s => s === 'success');
            const testsPassed = outcomes.tests === 'success';
            const passed = buildsPassed && testsPassed;

            const testLines = [];
            if (testsPassed && tests) {
              testLines.push(`**Tests** ✅ ${clamp(tests.passed)} passed, analyzer clean`);
            } else if (!tests || outcomes.tests === 'skipped') {
              testLines.push('**Tests** ⚠️ did not run, see the workflow log');
            } else {
              const failedCount = clamp(tests.failed);
              const passedCount = clamp(tests.passed);
              const analyzerErrors = clamp(tests.analyzer_errors);
              if (failedCount > 0) {
                testLines.push(`**Tests** ❌ ${failedCount} failed, ${passedCount} passed`);
                const listed = (Array.isArray(tests.failures) ? tests.failures : []).slice(0, 20);
                const more = clamp(tests.more_failures) +
                  Math.max(0, (Array.isArray(tests.failures) ? tests.failures.length : 0) - listed.length);
                const names = listed.map(name => `- \`${escapeText(name)}\``);
                if (more > 0) names.push(`- and ${more} more, see the workflow log`);
                testLines.push('', '<details><summary>Failing tests</summary>', '', ...names, '', '</details>');
              } else if (analyzerErrors === 0) {
                testLines.push('**Tests** ❌ the run crashed before reporting, see the workflow log');
              } else {
                testLines.push(`**Tests** ✅ ${passedCount} passed`);
              }
              if (analyzerErrors > 0) {
                testLines.push('');
                testLines.push(`**Analyzer** ❌ ${analyzerErrors} ${analyzerErrors === 1 ? 'error' : 'errors'}`);
                const sample = (Array.isArray(tests.analyzer_sample) ? tests.analyzer_sample : [])
                  .slice(0, 10).map(line => `- \`${escapeText(line)}\``);
                if (sample.length > 0) {
                  testLines.push('', '<details><summary>Analyzer errors</summary>', '', ...sample, '', '</details>');
                }
              }
            }

            const marker = '<!-- moonfin-build-result -->';
            const body = [
              marker,
              passed
                ? '## ✅ Build Successful'
                : buildsPassed ? '## ❌ Checks Failed' : '## ❌ Build Failed',
              '',
              passed
                ? 'All platform builds and tests passed. You can download the test artifacts below.'
                : buildsPassed
                  ? 'All platform builds passed, but the test run did not.'
                  : 'One or more platform builds failed. Artifacts are listed for the platforms that did build.',
              '',
              ...testLines,
              '',
              '| Platform | Status | Artifact |',
              '|---|---|---|',
              ...rows.map((row, i) =>
                `| **${row.platform}** | ${badge[statuses[i]] || '⚠️ Skipped'} | ${artifactCell(row)} |`),
              '',
              '| Property | Value |',
              '|---|---|',
              `| **Commit** | \`${outcomes.sha.substring(0, 7)}\` |`,
              `| **Workflow run** | [Build #${context.payload.workflow_run.run_number}](${runUrl}) |`,
            ].join('\n');

            // Paginated because the marker comment falls off the first page once
            // a pull request collects more than 30 comments, which would post a
            // second comment instead of updating the first.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: outcomes.pr_number,
              per_page: 100,
            });

            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: outcomes.pr_number, body });
            }

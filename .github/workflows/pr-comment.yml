name: PR Comment

# Posts one status comment on a pull request and rewrites it in place on every
# new commit. Checks and Build All Platforms report separately, so this runs
# when either one completes and rebuilds the whole comment from the latest
# results of both for that commit. It runs on workflow_run rather than
# pull_request so it still has write access on pull requests from forks. It
# never checks out the PR branch, it only reads the results artifacts the two
# workflows uploaded.

on:
  workflow_run:
    workflows: [Checks, Build All Platforms]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

# Checks and Build can finish for the same commit at the same time. One update
# waits for the other instead of the two interleaving.
concurrency:
  group: pr-comment-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  comment:
    runs-on: ubuntu-26.04
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')

    steps:
      # The run that triggered this is one of the two. The other one is the
      # other workflow's latest finished run for the same commit, if it has
      # finished yet.
      - name: Find the Checks and Build runs
        id: runs
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const isChecks = run.name === 'Checks';
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: isChecks ? 'build.yml' : 'checks.yml',
              head_sha: run.head_sha,
              event: 'pull_request',
              status: 'completed',
              per_page: 10,
            });
            // A cancelled run has no results to show, so it counts as not
            // finished yet.
            const other = data.workflow_runs.find(r => r.conclusion === 'success' || r.conclusion === 'failure');
            const set = (name, r) => {
              core.setOutput(`${name}_run_id`, r ? String(r.id) : '');
              core.setOutput(`${name}_run_number`, r ? String(r.run_number) : '');
              core.setOutput(`${name}_conclusion`, r ? r.conclusion : '');
            };
            set(isChecks ? 'checks' : 'build', run);
            set(isChecks ? 'build' : 'checks', other);

      # Each of these is missing when its workflow hasn't finished yet, or when
      # the job that uploads it died first. The comment still posts and says so.
      - name: Download build results
        if: steps.runs.outputs.build_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: build-results
          path: build-results
          run-id: ${{ steps.runs.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download test results
        if: steps.runs.outputs.checks_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: test-results
          path: test-results
          run-id: ${{ steps.runs.outputs.checks_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Apple test results
        if: steps.runs.outputs.build_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: apple-test-results
          path: apple-test-results
          run-id: ${{ steps.runs.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post PR comment
        uses: actions/github-script@v8
        env:
          CHECKS_RUN_ID: ${{ steps.runs.outputs.checks_run_id }}
          CHECKS_RUN_NUMBER: ${{ steps.runs.outputs.checks_run_number }}
          CHECKS_CONCLUSION: ${{ steps.runs.outputs.checks_conclusion }}
          BUILD_RUN_ID: ${{ steps.runs.outputs.build_run_id }}
          BUILD_RUN_NUMBER: ${{ steps.runs.outputs.build_run_number }}
        with:
          script: |
            const fs = require('fs');

            const readJson = (path) => {
              try {
                const value = JSON.parse(fs.readFileSync(path, 'utf8'));
                return value && typeof value === 'object' ? value : null;
              } catch (_) {
                return null;
              }
            };
            const outcomes = readJson('build-results/outcomes.json');
            const testResults = readJson('test-results/test-results.json');
            const appleResults = readJson('apple-test-results/test-results.json');

            // The artifacts were produced by the pull request's own code, so
            // numbers are clamped and names are escaped before they reach a
            // comment posted with the repository's token.
            const clamp = (n) => Number.isFinite(Number(n)) ? Math.max(0, Math.floor(Number(n))) : 0;
            const escapeText = (value) => String(value)
              .replace(/[`\r\n|]/g, ' ')
              .replace(/@/g, '@​')
              .slice(0, 200);

            const parts = [testResults, appleResults].filter(Boolean);
            const sum = (key) => parts.reduce((n, part) => n + clamp(part[key]), 0);
            const concat = (key) => parts.flatMap(part => Array.isArray(part[key]) ? part[key] : []);
            const tests = !testResults ? null : {
              passed: sum('passed'),
              failed: sum('failed'),
              failures: concat('failures'),
              more_failures: sum('more_failures'),
              analyzer_errors: sum('analyzer_errors'),
              analyzer_sample: concat('analyzer_sample'),
            };
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.workflow_run.head_sha;
            const runUrl = (id) => `${context.serverUrl}/${owner}/${repo}/actions/runs/${id}`;
            const checksRunId = process.env.CHECKS_RUN_ID;
            const buildRunId = process.env.BUILD_RUN_ID;

            // A workflow_run event from a fork doesn't name its pull request,
            // so the number comes from whichever results file is there. It is
            // only used when that pull request's head is still this commit,
            // which also keeps a slow run for an older push from overwriting
            // the comment for a newer one.
            const prNumber = [outcomes, testResults]
              .map(results => Number(results?.pr_number))
              .find(n => Number.isSafeInteger(n) && n > 0);
            if (!prNumber) {
              core.info('Neither workflow left a pull request number, nothing to post.');
              return;
            }
            let pull;
            try {
              ({ data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber }));
            } catch (error) {
              core.info(`Couldn't read pull request #${prNumber}: ${error.message}`);
              return;
            }
            if (pull.head.sha !== sha) {
              core.info(`#${prNumber} is at ${pull.head.sha} now, not ${sha}. The newer commit's runs post the comment.`);
              return;
            }

            const artifacts = new Map();
            if (buildRunId) {
              const { data: list } = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: Number(buildRunId),
                per_page: 100,
              });
              list.artifacts.forEach(a => artifacts.set(a.name, a));
            }

            const rows = [
              { platform: 'Android',       job: 'android',       artifact: 'android',              files: 'Moonfin_Android_v* (apk/aab)' },
              { platform: 'Android TV',    job: 'android',       artifact: 'android-tv',           files: 'Moonfin_AndroidTV_v* (apk/aab)' },
              { platform: 'iOS',           job: 'ios',           artifact: 'ios-ipa',              files: 'Moonfin_iOS_v*_unsigned.ipa' },
              { platform: 'macOS',         job: 'macos',         artifact: 'macos-dmg',            files: 'Moonfin_macOS_v*.dmg' },
              { platform: 'tvOS',          job: 'tvos',          artifact: 'tvos-ipa',             files: 'Moonfin_tvOS_v*_unsigned.ipa' },
              { platform: 'Windows x64',   job: 'windows',       artifact: 'windows-exe',          files: 'Moonfin_Windows_v*.exe' },
              { platform: 'Windows ARM64', job: 'windows_arm64', artifact: 'windows-arm64-exe',    files: 'Moonfin_WindowsARM64_v*.exe' },
              { platform: 'Linux x64',     job: 'linux',         artifact: 'linux-packages-x64',   files: 'Moonfin_Linux_v* (deb/rpm/AppImage/snap/flatpak/tar.gz)' },
              { platform: 'Linux ARM64',   job: 'linux',         artifact: 'linux-packages-arm64', files: 'Moonfin_LinuxARM64_v* (deb/rpm/AppImage/snap/flatpak/tar.gz)' },
              { platform: 'Web',           job: 'web',           artifact: 'web',                  files: 'build/web (static site, serve over HTTP)' },
            ];

            // Android builds both flavors and Linux both architectures in one matrix
            // job each, so a failure on either leg fails the job as a whole. An
            // artifact only uploads when its own leg got that far, so its presence
            // is what tells the two apart.
            const statusOf = (row) => {
              if (!buildRunId) return 'running';
              const result = outcomes?.[row.job];
              return result === 'success' || artifacts.has(row.artifact) ? 'success' : result;
            };

            const badge = { success: '✅ Passed', failure: '❌ Failed', running: '⏳ Running' };

            const artifactCell = (row) => {
              const artifact = artifacts.get(row.artifact);
              return artifact ? `[${row.files}](${runUrl(buildRunId)}/artifacts/${artifact.id})` : 'n/a';
            };

            // Checks is 'running' until it has a finished run for this commit.
            // The Apple XCTests still run in Build All Platforms.
            const checks = checksRunId ? process.env.CHECKS_CONCLUSION : 'running';
            const statuses = rows.map(statusOf);
            const buildsPassed = Boolean(buildRunId) && statuses.every(s => s === 'success');
            const appleTestsPassed = !buildRunId || outcomes?.apple_tests === 'success';
            const testsPassed = checks === 'success' && Boolean(tests) && appleTestsPassed;
            const passed = buildsPassed && testsPassed;

            const testLines = [];
            if (checks === 'running') {
              testLines.push('**Tests** ⏳ running');
            } else if (testsPassed && tests) {
              testLines.push(`**Tests** ✅ ${clamp(tests.passed)} passed, analyzer clean`);
            } else if (!tests) {
              testLines.push('**Tests** ⚠️ did not run, see the workflow log');
            } else {
              const failedCount = clamp(tests.failed);
              const passedCount = clamp(tests.passed);
              const analyzerErrors = clamp(tests.analyzer_errors);
              if (failedCount > 0) {
                testLines.push(`**Tests** ❌ ${failedCount} failed, ${passedCount} passed`);
                const listed = (Array.isArray(tests.failures) ? tests.failures : []).slice(0, 20);
                const more = clamp(tests.more_failures) +
                  Math.max(0, (Array.isArray(tests.failures) ? tests.failures.length : 0) - listed.length);
                const names = listed.map(name => `- \`${escapeText(name)}\``);
                if (more > 0) names.push(`- and ${more} more, see the workflow log`);
                testLines.push('', '<details><summary>Failing tests</summary>', '', ...names, '', '</details>');
              } else if (analyzerErrors === 0) {
                testLines.push('**Tests** ❌ the run crashed before reporting, see the workflow log');
              } else {
                testLines.push(`**Tests** ✅ ${passedCount} passed`);
              }
              if (analyzerErrors > 0) {
                testLines.push('');
                testLines.push(`**Analyzer** ❌ ${analyzerErrors} ${analyzerErrors === 1 ? 'error' : 'errors'}`);
                const sample = (Array.isArray(tests.analyzer_sample) ? tests.analyzer_sample : [])
                  .slice(0, 10).map(line => `- \`${escapeText(line)}\``);
                if (sample.length > 0) {
                  testLines.push('', '<details><summary>Analyzer errors</summary>', '', ...sample, '', '</details>');
                }
              }
            }

            // Checks usually reports first, Build All Platforms takes longer.
            let headline;
            let summary;
            if (!buildRunId) {
              headline = testsPassed ? '## ✅ Checks Passed' : '## ❌ Checks Failed';
              summary = testsPassed
                ? 'The analyzer and tests passed. The platform builds are still running, this comment updates when they finish.'
                : 'The analyzer or tests failed. The platform builds are still running, this comment updates when they finish.';
            } else if (checks === 'running' && buildsPassed) {
              headline = '## ⏳ Checks Running';
              summary = 'All platform builds passed. The analyzer and tests are still running, this comment updates when they finish.';
            } else if (passed) {
              headline = '## ✅ Build Successful';
              summary = 'All platform builds and tests passed. You can download the test artifacts below.';
            } else if (buildsPassed) {
              headline = '## ❌ Checks Failed';
              summary = 'All platform builds passed, but the test run did not.';
            } else {
              headline = '## ❌ Build Failed';
              summary = 'One or more platform builds failed. Artifacts are listed for the platforms that did build.';
            }

            const runLink = (name, id, number) =>
              id ? `[${name} #${clamp(number)}](${runUrl(Number(id))})` : '⏳ Running';

            const marker = '<!-- moonfin-build-result -->';
            const body = [
              marker,
              headline,
              '',
              summary,
              '',
              ...testLines,
              '',
              '| Platform | Status | Artifact |',
              '|---|---|---|',
              ...rows.map((row, i) =>
                `| **${row.platform}** | ${badge[statuses[i]] || '⚠️ Skipped'} | ${artifactCell(row)} |`),
              '',
              '| Property | Value |',
              '|---|---|',
              `| **Commit** | \`${sha.substring(0, 7)}\` |`,
              `| **Checks run** | ${runLink('Checks', checksRunId, process.env.CHECKS_RUN_NUMBER)} |`,
              `| **Build run** | ${runLink('Build', buildRunId, process.env.BUILD_RUN_NUMBER)} |`,
            ].join('\n');

            // Paginated because the marker comment falls off the first page once
            // a pull request collects more than 30 comments, which would post a
            // second comment instead of updating the first.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }

name: Warm the Gradle cache

# Build All Platforms runs only on PRs and tags, and a cache saved there can't
# be read by any other PR. Maven Central refuses the shared runner IPs often
# enough (429/403) to fail PR runs, so this saves the Gradle cache on main,
# where every PR can restore it. The cache path, key and restore-keys must
# match the android job in build.yml and the kotlin suite in checks.yml
# exactly, or the keys stop matching. Those only restore, so this workflow is
# the one writer, and it saves under the exact key only when every step
# succeeded. An exact hit here is therefore always an entry it resolved in
# full.
on:
  workflow_dispatch:
  schedule:
    # Recreates the entry if the cache was evicted. With the entry in place
    # the run stops after the restore.
    - cron: '17 4 * * *'
  push:
    branches:
      - main
    paths:
      - '**/*.gradle*'
      - '**/gradle-wrapper.properties'
      - 'pubspec.lock'
      - '.github/workflows/build.yml'
      - '.github/workflows/gradle-cache.yml'

permissions:
  contents: read

concurrency:
  group: gradle-cache
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Read from build.yml rather than kept here too, so a Flutter upgrade
      # there can't leave this cache built with the old one.
      - name: Read the Flutter version build.yml uses
        id: flutter
        run: |
          version=$(sed -n "s/^  FLUTTER_VERSION: '\(.*\)'$/\1/p" .github/workflows/build.yml)
          if [ -z "$version" ]; then
            echo "::error file=.github/workflows/build.yml::Couldn't find FLUTTER_VERSION in build.yml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v5
        id: cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: gradle-${{ runner.os }}-flutter-${{ steps.flutter.outputs.version }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-flutter-${{ steps.flutter.outputs.version }}-

      - uses: subosito/flutter-action@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}

      # The same as the android job in build.yml, which the release build
      # below needs on the 16 GB runner.
      - name: Limit Gradle memory
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
          kotlin.daemon.jvmargs=-Xmx2G
          EOF

      # The same Gradle invocation as the kotlin test suite, so the cache holds
      # what it resolves. A partial restore from restore-keys is topped up here.
      - name: Resolve the kotlin tests' dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          flutter pub get
          flutter build apk --config-only
          cd android && ./gradlew --continue :app:testAndroidTvDebugUnitTest :moonfin_native_video:testDebugUnitTest

      # The android job builds release, which needs the release Flutter engine
      # artifacts the debug unit tests don't. Both flavors have the same
      # dependencies, so one APK covers them. Runs after a test failure too, so
      # a red main still warms everything it can. The daemons are stopped for
      # the same reason as in build-android.sh.
      - name: Resolve the release build's dependencies
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        run: |
          (cd android && ./gradlew --stop) || true
          pkill -f KotlinCompileDaemon || true
          flutter build apk --release --flavor mobile --dart-define=DISTRIBUTION_CHANNEL=apk

      # A failed run (a test failure, or Maven Central refusing a download)
      # still saves what it resolved, but under a key of its own: PRs can fall
      # back to it, and the next run misses the exact key and tries again
      # rather than taking an incomplete entry as done.
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: ${{ steps.cache.outputs.cache-primary-key }}${{ job.status == 'failure' && format('-partial-{0}', github.run_id) || '' }}

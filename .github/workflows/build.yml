name: Build All Platforms

on:
  workflow_dispatch:
    inputs:
      run_all:
        description: Run all platform jobs
        type: boolean
        default: true
      android:
        description: Run Android job
        type: boolean
        default: false
      ios:
        description: Run iOS job
        type: boolean
        default: false
      macos:
        description: Run macOS job
        type: boolean
        default: false
      windows:
        description: Run Windows job
        type: boolean
        default: false
      windows_arm64:
        description: Run Windows ARM64 job
        type: boolean
        default: false
      linux:
        description: Run Linux job
        type: boolean
        default: false
      tvos:
        description: Run tvOS job
        type: boolean
        default: false
      distribution:
        description: Where the Apple builds go. release keeps the artifacts, testflight uploads to App Store Connect and skips every other platform
        type: choice
        default: release
        options:
          - release
          - testflight
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - main
    # labeled so adding a ci:<platform> label builds that platform right away.
    types: [opened, synchronize, reopened, labeled]
  # Fires only once a merge queue is enabled on main.
  merge_group:

permissions:
  contents: write
  actions: read

# A new push to a pull request replaces its running build. Every other run
# gets a group of its own, so tags and manual runs never queue or cancel.
# So does a run started by adding a label that isn't ci:<platform>, such as
# bug: it builds nothing (see plan), so it mustn't cancel the build that is
# running for the same commit.
concurrency:
  group: build-${{ (github.event.action == 'labeled' && !startsWith(github.event.label.name, 'ci:')) && github.run_id || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # checks.yml and gradle-cache.yml read this line with sed, so keep it on
  # one line in this form.
  FLUTTER_VERSION: '3.47.2'
  FLUTTER_TVOS_REF: 'v3.47.2-tvos.1.10.0'

jobs:
  # Decides which platform jobs run. Job-level if can't read env, so this one
  # job decides and the platform jobs need it. A manual run follows its inputs
  # exactly as before. Tags and the merge queue build everything. A pull
  # request builds everything while PLATFORM_BUILDS_ON_PUSH is 'true', and
  # otherwise only the platforms named by its ci:<platform> or ci:full labels.
  # Adding any other label skips plan, and with it every job below, so that
  # run leaves no build check and no results behind.
  plan:
    if: ${{ !(github.event.action == 'labeled' && !startsWith(github.event.label.name, 'ci:')) }}
    runs-on: ubuntu-26.04
    outputs:
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      macos: ${{ steps.plan.outputs.macos }}
      tvos: ${{ steps.plan.outputs.tvos }}
      windows: ${{ steps.plan.outputs.windows }}
      windows_arm64: ${{ steps.plan.outputs.windows_arm64 }}
      linux: ${{ steps.plan.outputs.linux }}
      web: ${{ steps.plan.outputs.web }}
      apple_tests: ${{ steps.plan.outputs.apple_tests }}
    steps:
      - id: plan
        env:
          # Flipped to 'false' the day the merge queue goes on. Until then every
          # pull request push builds every platform, as before.
          PLATFORM_BUILDS_ON_PUSH: 'true'
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'EOF'
          import json, os
          event, ref = os.environ['EVENT'], os.environ['REF']
          # Actions compares label names without case, so this does too.
          labels = {l.lower() for l in json.loads(os.environ['LABELS'] or 'null') or []}
          inputs = json.loads(os.environ['INPUTS'] or 'null') or {}
          everywhere = event == 'merge_group' or ref.startswith('refs/tags/')
          on_push = os.environ['PLATFORM_BUILDS_ON_PUSH'] == 'true' and event == 'pull_request'
          testflight = inputs.get('distribution') == 'testflight'

          # dispatch_inputs: the manual-run inputs that select the job. apple:
          # the job also runs for a TestFlight upload, which skips every other
          # platform.
          def want(label, dispatch_inputs, apple=False):
              if event == 'workflow_dispatch':
                  return any(inputs.get(i) for i in dispatch_inputs) and (apple or not testflight)
              return everywhere or on_push or 'ci:full' in labels or f'ci:{label}' in labels

          out = {
              'android':       want('android', ['run_all', 'android']),
              'ios':           want('apple', ['run_all', 'ios'], apple=True),
              'macos':         want('apple', ['run_all', 'macos'], apple=True),
              'tvos':          want('apple', ['run_all', 'tvos'], apple=True),
              'windows':       want('windows', ['run_all', 'windows']),
              'windows_arm64': want('windows', ['run_all', 'windows_arm64']),
              'linux':         want('linux', ['run_all', 'linux']),
              # Web has no release artifact, so it never ran on tags or manual runs.
              'web':           event in ('pull_request', 'merge_group') and want('web', []),
              'apple_tests':   want('apple', ['run_all'], apple=True),
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for k, v in out.items():
                  f.write(f'{k}={"true" if v else "false"}\n')
          print(out)
          EOF

  # Android APK + AAB, with mobile and TV on their own runners
  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    name: android (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mobile
            artifact: android
            files: Moonfin_Android_v*.*
          - target: tv
            artifact: android-tv
            files: Moonfin_AndroidTV_v*.*
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Restores the Gradle cache gradle-cache.yml saves on main, so a PR run
      # doesn't download every dependency from Maven Central, which refuses
      # the shared runner IPs (429/403). Restore only: the warmer is the one
      # writer, so an entry under its key always holds what this release build
      # and the kotlin tests resolve. When a PR changes a hashed file,
      # restore-keys falls back to main's entry for the same Flutter version.
      # Robolectric fetches its android-all jars into ~/.m2, not through
      # Gradle, so that is cached too. Keep path, key and restore-keys the
      # same here, in the kotlin suite in checks.yml and in gradle-cache.yml,
      # or the keys stop matching.
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: gradle-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Set up signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # On PRs from forks the signing secrets are not available. Skip signing
          # setup so Gradle falls back to debug signing and the build still runs.
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No Android keystore secret; skipping release signing (debug-signed build)."
            exit 0
          fi

          # Use printf (not echo) to avoid adding a trailing newline that can corrupt binary decode on some shells.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

          cat > android/keystore.properties <<EOF
          storeFile=../release.keystore
          storeType=$STORE_TYPE
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          # Fail fast with a clearer error if the keystore secret or type is wrong.
          if [ -n "$STORE_TYPE" ]; then
            keytool -list -v -keystore android/app/release.keystore -storetype "$STORE_TYPE" -storepass "$STORE_PASSWORD" >/dev/null
          else
            keytool -list -v -keystore android/app/release.keystore -storepass "$STORE_PASSWORD" >/dev/null
          fi

      # The 8 GB heap in android/gradle.properties suits a dev machine, but on
      # the 16 GB runner it leaves no room for the Dart AOT compiles. The user
      # gradle.properties takes precedence over the project one.
      - name: Limit Gradle memory
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
          kotlin.daemon.jvmargs=-Xmx2G
          EOF

      - name: Build
        run: |
          chmod +x build-android.sh
          ./build-android.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}

  # iOS: an unsigned IPA for releases, or a TestFlight upload
  ios:
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Resolve dependencies
        run: |
          flutter clean
          flutter pub get

      # pod install, run by the builds below, resolves moonfin_game_host's
      # vendored_frameworks glob, so the cores have to exist first or the app
      # ships with none. The wrap step's no-JIT gate keeps the prebuilt cores
      # App Store safe.
      - name: Provision the bundled libretro cores
        run: |
          chmod +x ios/game_host/fetch_cores.sh ios/game_host/wrap_frameworks.sh
          ./ios/game_host/fetch_cores.sh
          ./ios/game_host/wrap_frameworks.sh

      - name: Build unsigned IPA
        if: ${{ inputs.distribution != 'testflight' }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '[:space:]')
          flutter build ipa --release --no-codesign

          APP_PATH=$(find build/ios/archive -type d -path '*/Products/Applications/*.app' | head -1)
          TMPDIR=$(mktemp -d)
          mkdir -p "$TMPDIR/Payload"
          cp -R "$APP_PATH" "$TMPDIR/Payload/"
          (cd "$TMPDIR" && zip -qry "$OLDPWD/Moonfin_iOS_v${VERSION}_unsigned.ipa" Payload)
          rm -rf "$TMPDIR"

      - uses: actions/upload-artifact@v6
        if: ${{ inputs.distribution != 'testflight' }}
        with:
          name: ios-ipa
          path: Moonfin_iOS_v*_unsigned.ipa

      - name: Set up App Store signing
        if: ${{ inputs.distribution == 'testflight' }}
        id: signing
        uses: ./.github/actions/apple-signing
        with:
          certificate-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          certificate-required: 'true'
          asc-key-base64: ${{ secrets.APPLE_ASC_API_KEY_BASE64 }}

      # flutter build ipa never hands the API key to xcodebuild, so on a runner
      # with no Apple ID it cannot fetch a profile. flutter build writes the
      # project settings and the snapshot, then xcodebuild archives with the key.
      - name: Archive for App Store
        if: ${{ inputs.distribution == 'testflight' }}
        run: |
          flutter build ios --release --no-codesign --dart-define=DISTRIBUTION_CHANNEL=ios_signed
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.signing.outputs.asc-key-path }}" \
            -authenticationKeyID "${{ secrets.APPLE_ASC_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPLE_ASC_API_ISSUER_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            archive

      - name: Upload to TestFlight
        if: ${{ inputs.distribution == 'testflight' }}
        uses: ./.github/actions/testflight-upload
        with:
          archive-path: ${{ runner.temp }}/Runner.xcarchive
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          asc-key-path: ${{ steps.signing.outputs.asc-key-path }}
          asc-key-id: ${{ secrets.APPLE_ASC_API_KEY_ID }}
          asc-issuer-id: ${{ secrets.APPLE_ASC_API_ISSUER_ID }}

  # macOS: a signed and notarized DMG for releases, or a TestFlight upload
  macos:
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      # On PRs from forks the certificate secret is not available, so this
      # skips and build-macos.sh falls back to an ad-hoc signature.
      - name: Set up Developer ID signing
        uses: ./.github/actions/apple-signing
        with:
          certificate-base64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Store notarytool credentials
        if: ${{ inputs.distribution != 'testflight' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ]; then
            echo "No Apple ID configured, skipping notarytool credentials"
            exit 0
          fi
          xcrun notarytool store-credentials "moonfin-notary" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Build signed DMG
        if: ${{ inputs.distribution != 'testflight' }}
        env:
          APP_SIGN_ID: ${{ secrets.MACOS_APP_SIGN_ID }}
          INSTALLER_ID: ${{ secrets.MACOS_INSTALLER_ID }}
          NOTARYTOOL_PROFILE: ${{ secrets.APPLE_ID != '' && 'moonfin-notary' || '' }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_APPSTORE_PKG: '0'
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh

      - uses: actions/upload-artifact@v6
        if: ${{ inputs.distribution != 'testflight' }}
        with:
          name: macos-dmg
          path: Moonfin_macOS_v*.dmg

      # The App Store build signs with the Apple Distribution identity rather
      # than Developer ID, and needs the API key to fetch a Mac App Store
      # profile on a runner with no Apple ID.
      - name: Set up App Store signing
        if: ${{ inputs.distribution == 'testflight' }}
        id: signing
        uses: ./.github/actions/apple-signing
        with:
          certificate-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          certificate-required: 'true'
          asc-key-base64: ${{ secrets.APPLE_ASC_API_KEY_BASE64 }}

      - name: Archive and upload to TestFlight
        if: ${{ inputs.distribution == 'testflight' }}
        env:
          BUILD_APPSTORE_PKG: '1'
          BUILD_DMG_GITHUB: '0'
          EXPORT_DESTINATION: upload
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_PATH: ${{ steps.signing.outputs.asc-key-path }}
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_API_ISSUER_ID }}
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh

  # tvOS: an unsigned IPA for releases, or a TestFlight upload
  tvos:
    needs: plan
    if: needs.plan.outputs.tvos == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install tvOS platform
        run: |
          sudo xcodebuild -runFirstLaunch || true
          for i in 1 2 3 4 5 6; do
            if xcodebuild -downloadPlatform tvOS; then
              exit 0
            fi
            echo "downloadPlatform attempt $i failed, retrying in 25s"
            sleep 25
          done
          echo "::error::tvOS platform install failed after 6 attempts"
          exit 1

      - name: Cache flutter-tvos toolchain
        id: cache-fluttertvos
        uses: actions/cache@v5
        with:
          path: ~/flutter-tvos
          key: flutter-tvos-${{ env.FLUTTER_TVOS_REF }}-${{ runner.os }}-arm64

      - name: Install flutter-tvos
        if: steps.cache-fluttertvos.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$FLUTTER_TVOS_REF" \
            https://github.com/fluttertv/flutter-tvos.git "$HOME/flutter-tvos"

      - name: Add flutter-tvos to PATH and precache
        run: |
          echo "$HOME/flutter-tvos/bin" >> "$GITHUB_PATH"
          "$HOME/flutter-tvos/bin/flutter-tvos" precache

      - name: Resolve dependencies
        run: flutter-tvos pub get

      # This runs before the tool builds because the tool embeds the Flutter
      # engine signed with whatever Apple Distribution identity it finds, and
      # an unsigned engine is rejected at upload (ITMS-91065). The release path
      # stays unsigned.
      - name: Set up App Store signing
        if: ${{ inputs.distribution == 'testflight' }}
        id: signing
        uses: ./.github/actions/apple-signing
        with:
          certificate-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          certificate-required: 'true'
          asc-key-base64: ${{ secrets.APPLE_ASC_API_KEY_BASE64 }}

      # The tool's own build stops before the app is signed, but by then it
      # has written the project settings and the assets.
      - name: Prepare Flutter build settings
        run: |
          flutter-tvos build tvos --release --no-tree-shake-icons --dart-define=MOONFIN_TVOS=true || true
          test -f tvos/Flutter/Generated.xcconfig
          grep -q '^FLUTTER_ROOT=' tvos/Flutter/Generated.xcconfig \
            || echo "FLUTTER_ROOT=$HOME/flutter-tvos" >> tvos/Flutter/Generated.xcconfig

      # The flutter tool writes the plugin registry without a tvos section, so
      # the pods it names have to be put back before CocoaPods reads it, or the
      # Runner links against nothing.
      - name: Install pods
        env:
          LC_ALL: en_US.UTF-8
        run: |
          python3 tvos/scripts/restore_tvos_plugins.py
          cd tvos && pod install

      - name: Stage flutter_assets for the Xcode copy phase
        run: |
          DEST="tvos/Flutter/flutter_assets"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          SRC_APP=$(find build/tvos -maxdepth 3 -type d -path "*Release-appletvos/Runner.app/flutter_assets" | head -1)
          if [ -n "$SRC_APP" ]; then
            rsync -a "$SRC_APP/" "$DEST/"
          else
            rsync -a \
              --exclude='*-appletvos' --exclude='*-appletvsimulator' \
              --exclude='aot' --exclude='.last_build_id' \
              --exclude='kernel_blob.bin' --exclude='vm_snapshot_data' \
              --exclude='isolate_snapshot_data' \
              build/tvos/ "$DEST/"
          fi
          test -f "$DEST/fonts/MaterialIcons-Regular.otf" \
            || { echo "::error::MaterialIcons font missing from staged flutter_assets"; exit 1; }
          test -f "$DEST/AssetManifest.bin" \
            || { echo "::error::AssetManifest.bin missing from staged flutter_assets"; exit 1; }

      - name: Build unsigned app
        if: ${{ inputs.distribution != 'testflight' }}
        run: |
          xcodebuild \
            -workspace tvos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk appletvos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Archive for App Store
        if: ${{ inputs.distribution == 'testflight' }}
        run: |
          xcodebuild \
            -workspace tvos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.signing.outputs.asc-key-path }}" \
            -authenticationKeyID "${{ secrets.APPLE_ASC_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPLE_ASC_API_ISSUER_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            archive

      # App Store Connect rejects an App.framework whose Info.plist floor
      # disagrees with the binary (ITMS-90208), and a build that lost the Top
      # Shelf extension or its fonts is not worth shipping either way.
      - name: Verify the app bundle
        env:
          APP: ${{ inputs.distribution == 'testflight' && format('{0}/Runner.xcarchive/Products/Applications/Runner.app', runner.temp) || format('{0}/dd/Build/Products/Release-appletvos/Runner.app', runner.temp) }}
        run: |
          test -d "$APP" || { echo "::error::no app bundle at $APP"; exit 1; }
          test -f "$APP/flutter_assets/fonts/MaterialIcons-Regular.otf" \
            || { echo "::error::Built app is missing flutter_assets fonts"; exit 1; }
          test -e "$APP/PlugIns/MoonfinTopShelf.appex/MoonfinTopShelf" \
            || { echo "::error::Top Shelf extension missing from PlugIns"; exit 1; }
          PLIST_MIN=$(plutil -extract MinimumOSVersion raw "$APP/Frameworks/App.framework/Info.plist")
          BIN_MIN=$(vtool -show-build "$APP/Frameworks/App.framework/App" | awk '/minos/{print $2; exit}')
          [ "$PLIST_MIN" = "$BIN_MIN" ] \
            || { echo "::error::App.framework MinimumOSVersion ($PLIST_MIN) != binary minos ($BIN_MIN) (ITMS-90208)"; exit 1; }

      - name: Package unsigned IPA
        if: ${{ inputs.distribution != 'testflight' }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '[:space:]')
          APP="$RUNNER_TEMP/dd/Build/Products/Release-appletvos/Runner.app"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          ( cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/Moonfin_tvOS_v${VERSION}_unsigned.ipa" Payload )

      - uses: actions/upload-artifact@v6
        if: ${{ inputs.distribution != 'testflight' }}
        with:
          name: tvos-ipa
          path: Moonfin_tvOS_v*_unsigned.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        if: ${{ inputs.distribution == 'testflight' }}
        uses: ./.github/actions/testflight-upload
        with:
          archive-path: ${{ runner.temp }}/Runner.xcarchive
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          asc-key-path: ${{ steps.signing.outputs.asc-key-path }}
          asc-key-id: ${{ secrets.APPLE_ASC_API_KEY_ID }}
          asc-issuer-id: ${{ secrets.APPLE_ASC_API_ISSUER_ID }}

  # Windows installer EXE
  windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # vcpkg builds libarchive and its dependencies from source, OpenSSL
      # included, which took about 13 minutes of every run. Its binary cache
      # skips that once a run on main or an earlier run of the same PR saved it.
      - name: Find the runner's vcpkg and image versions
        id: vcpkg
        shell: pwsh
        run: |
          $commit = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ~\AppData\Local\vcpkg\archives
          # The image version is in the key because an image update can bring
          # a new compiler with the same vcpkg, and a cache that matched the key
          # exactly would never be saved again. On a new image this starts from
          # the last cache, and vcpkg's ABI hashes rebuild whatever went stale.
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.image }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Build installer
        shell: pwsh
        run: .\build-windows.ps1

      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path . -Filter "Moonfin_Windows_v*.exe" -File -ErrorAction SilentlyContinue
          if (-not $artifacts -or $artifacts.Count -eq 0) {
            throw "Windows build did not produce Moonfin_Windows_v*.exe"
          }
          Write-Host "Found Windows artifact(s):"
          $artifacts | ForEach-Object { Write-Host "  - $($_.Name)" }

      - uses: actions/upload-artifact@v6
        id: unsigned-windows
        with:
          name: windows-exe
          path: Moonfin_Windows_v*.exe
          if-no-files-found: error

      # Tags only, so a pull request neither spends a signing request nor needs
      # the token. Inno Setup packs moonfin.exe and its DLLs before this runs,
      # so the installer is signed but the files it carries are not.
      - name: Sign installer
        if: startsWith(github.ref, 'refs/tags/')
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: Moonfin-Core
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'test-signing' }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # Overwrites the unsigned upload, so the release job sees one artifact per
      # architecture rather than two carrying the same filename.
      - name: Replace with the signed installer
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: windows-exe
          path: signed/Moonfin_Windows_v*.exe
          overwrite: true
          if-no-files-found: error

      # Tags and manual runs only, since rebuilding for the Store doubles the
      # job's time.
      - name: Build Microsoft Store package
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: .\build-windows.ps1 -Store

      - uses: actions/upload-artifact@v6
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: windows-msix
          path: MoonfinStore_Windows_v*.msix
          if-no-files-found: error

  # Windows ARM64 installer EXE (native build on an ARM64 runner)
  windows-arm64:
    needs: plan
    if: needs.plan.outputs.windows_arm64 == 'true'
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5

      - name: Verify ARM64 runner
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
            throw "This job must run on a native ARM64 Windows runner"
          }

      # subosito/flutter-action does not provide a native ARM64 SDK, so clone the
      # SDK directly to get the windows_arm64 Dart SDK (required for an ARM64 build).
      - name: Set up Flutter (native ARM64)
        shell: pwsh
        run: |
          git clone https://github.com/flutter/flutter.git --branch $env:FLUTTER_VERSION --depth 1 C:\flutter
          echo "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Assert Flutter is using a native ARM64 Dart SDK
        shell: pwsh
        run: |
          $dartVersion = (& dart --version 2>&1 | Out-String)
          Write-Host $dartVersion
          if ($dartVersion -notmatch 'windows_arm64|arm64') {
            throw "Flutter is using an x64 Dart SDK on this ARM64 runner ($($dartVersion.Trim())). Bump FLUTTER_VERSION to a release that ships the arm64 Dart SDK (>= 3.44.0)."
          }

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # vcpkg builds libarchive and its dependencies from source, OpenSSL
      # included, which took about 13 minutes of every run. Its binary cache
      # skips that once a run on main or an earlier run of the same PR saved it.
      - name: Find the runner's vcpkg and image versions
        id: vcpkg
        shell: pwsh
        run: |
          $commit = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ~\AppData\Local\vcpkg\archives
          # The image version is in the key because an image update can bring
          # a new compiler with the same vcpkg, and a cache that matched the key
          # exactly would never be saved again. On a new image this starts from
          # the last cache, and vcpkg's ABI hashes rebuild whatever went stale.
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.image }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Build ARM64 installer
        shell: pwsh
        run: .\build-windows.ps1 -Architecture arm64

      - name: Verify Windows ARM64 artifact
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path . -Filter "Moonfin_WindowsARM64_v*.exe" -File -ErrorAction SilentlyContinue
          if (-not $artifacts -or $artifacts.Count -eq 0) {
            throw "Windows ARM64 build did not produce Moonfin_WindowsARM64_v*.exe"
          }
          Write-Host "Found Windows ARM64 artifact(s):"
          $artifacts | ForEach-Object { Write-Host "  - $($_.Name)" }

      - uses: actions/upload-artifact@v6
        id: unsigned-windows-arm64
        with:
          name: windows-arm64-exe
          path: Moonfin_WindowsARM64_v*.exe
          if-no-files-found: error

      # Tags only, so a pull request neither spends a signing request nor needs
      # the token. Inno Setup packs moonfin.exe and its DLLs before this runs,
      # so the installer is signed but the files it carries are not.
      - name: Sign installer
        if: startsWith(github.ref, 'refs/tags/')
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: Moonfin-Core
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'test-signing' }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.unsigned-windows-arm64.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # Overwrites the unsigned upload, so the release job sees one artifact per
      # architecture rather than two carrying the same filename.
      - name: Replace with the signed installer
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: windows-arm64-exe
          path: signed/Moonfin_WindowsARM64_v*.exe
          overwrite: true
          if-no-files-found: error

      - name: Build Microsoft Store package
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: .\build-windows.ps1 -Architecture arm64 -Store

      - uses: actions/upload-artifact@v6
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: windows-arm64-msix
          path: MoonfinStore_WindowsARM64_v*.msix
          if-no-files-found: error

  # Linux packages, built natively for each architecture
  linux:
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            appimagetool_arch: x86_64
            artifact_prefix: Moonfin_Linux
          # glibc and libstdc++ are deliberately not bundled, so the build host
          # decides the oldest system the packages can run on. 24.04 puts that
          # floor at glibc 2.38, newer than the Debian 12 base that Raspberry Pi
          # OS and most other ARM64 boards run. 22.04 puts it at 2.35.
          - arch: arm64
            runner: ubuntu-22.04-arm
            appimagetool_arch: aarch64
            artifact_prefix: Moonfin_LinuxARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Flutter publishes no Linux ARM64 SDK archive for the action to fetch, so
      # the SDK is cloned instead and its own bootstrap pulls the arm64 Dart SDK
      # and engine artifacts to match the host.
      - name: Set up Flutter (native ARM64)
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          git clone https://github.com/flutter/flutter.git \
            --branch "$FLUTTER_VERSION" --depth 1 "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Install system build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libmpv-dev libsecret-1-dev libasound2-dev \
            libarchive-dev \
            rpm \
            flatpak flatpak-builder \
            libfuse2 \
            zsync

      - name: Verify webkit2gtk availability
        run: |
          set -euo pipefail
          if pkg-config --exists webkit2gtk-4.1; then
            echo "Found webkit2gtk-4.1: $(pkg-config --modversion webkit2gtk-4.1)"
          elif pkg-config --exists webkit2gtk-4.2; then
            echo "Found webkit2gtk-4.2: $(pkg-config --modversion webkit2gtk-4.2)"
          elif pkg-config --exists webkit2gtk-4.3; then
            echo "Found webkit2gtk-4.3: $(pkg-config --modversion webkit2gtk-4.3)"
          else
            echo "No supported webkit2gtk version found (need 4.1/4.2/4.3)."
            exit 1
          fi

      - name: Install appimagetool
        run: |
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimagetool_arch }}.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build all Linux packages
        run: |
          chmod +x build-linux.sh
          ./build-linux.sh all

      - name: Verify Linux artifacts
        env:
          PREFIX: ${{ matrix.artifact_prefix }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          patterns=(
            "${PREFIX}_v*.tar.gz"
            "${PREFIX}_v*.AppImage"
            "${PREFIX}_v*.AppImage.zsync"
            "${PREFIX}_v*.deb"
            "${PREFIX}_v*.rpm"
            "${PREFIX}_v*.snap"
            "${PREFIX}_v*.flatpak"
          )

          missing=0
          for pattern in "${patterns[@]}"; do
            matches=( $pattern )
            if [ ${#matches[@]} -eq 0 ]; then
              echo "Missing artifact for pattern: $pattern"
              missing=1
            else
              for m in "${matches[@]}"; do
                echo "Found artifact: $m"
              done
            fi
          done

          if [ $missing -ne 0 ]; then
            echo "One or more Linux package artifacts are missing."
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            ${{ matrix.artifact_prefix }}_v*.tar.gz
            ${{ matrix.artifact_prefix }}_v*.AppImage
            ${{ matrix.artifact_prefix }}_v*.AppImage.zsync
            ${{ matrix.artifact_prefix }}_v*.deb
            ${{ matrix.artifact_prefix }}_v*.rpm
            ${{ matrix.artifact_prefix }}_v*.snap
            ${{ matrix.artifact_prefix }}_v*.flatpak
          if-no-files-found: error

  # Web, built at the root base href so the artifact runs from any static server
  web:
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Build web
        run: flutter build web --wasm --release

      - uses: actions/upload-artifact@v6
        with:
          name: web
          path: build/web
          if-no-files-found: error

  # The XCTest targets for the native iOS and macOS code, which flutter test
  # can't reach. tvOS has no test target of its own.
  apple-tests:
    needs: plan
    if: needs.plan.outputs.apple_tests == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      # No libretro cores are fetched here, so the game host pod vendors none
      # and the app links for the simulator.
      - name: Run XCTests
        run: |
          mkdir -p "$RUNNER_TEMP/apple-tests"
          status=0
          flutter pub get

          flutter build ios --debug --simulator --config-only
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, entries in sorted(devices.items(), reverse=True)
                     if 'iOS' in runtime for d in entries if d['name'].startswith('iPhone')))
          ")
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug \
            -destination "id=$DEVICE" -clonedSourcePackagesDirPath build/ios/SourcePackages \
            -resultBundlePath "$RUNNER_TEMP/apple-tests/ios.xcresult" \
            CODE_SIGNING_ALLOWED=NO || status=1

          flutter build macos --debug --config-only
          xcodebuild test -workspace macos/Runner.xcworkspace -scheme Runner -configuration Debug \
            -destination platform=macOS -clonedSourcePackagesDirPath build/macos/SourcePackages \
            -resultBundlePath "$RUNNER_TEMP/apple-tests/macos.xcresult" \
            CODE_SIGNING_ALLOWED=NO || status=1

          echo "$status" > "$RUNNER_TEMP/apple-tests/run-status"

      - name: Summarize results
        if: always()
        run: |
          python3 - <<'EOF'
          import glob
          import json
          import os
          import secrets
          import subprocess

          root = os.environ['RUNNER_TEMP'] + '/apple-tests'
          passed = failed = 0
          failures = []
          # What each failure said, for the log. The JSON only keeps names.
          details = []

          def messages(node):
              found = [node.get('name', '')] if node.get('nodeType') == 'Failure Message' else []
              for child in node.get('children', []):
                  found += messages(child)
              return found

          def walk(node, suite, platform):
              global passed, failed
              if node.get('nodeType') == 'Test Suite':
                  suite = node.get('name', suite)
              if node.get('nodeType') == 'Test Case':
                  if node.get('result') == 'Passed':
                      passed += 1
                  elif node.get('result') == 'Failed':
                      failed += 1
                      label = f"{platform}: {suite}.{node.get('name', '?')}"
                      failures.append(label)
                      details.append((label, '\n'.join(messages(node)) or 'No failure message was reported.'))
              for child in node.get('children', []):
                  walk(child, suite, platform)

          for path in sorted(glob.glob(root + '/*.xcresult')):
              platform = os.path.basename(path)[:-9]
              report = subprocess.run(
                  ['xcrun', 'xcresulttool', 'get', 'test-results', 'tests', '--path', path],
                  capture_output=True, text=True)
              if report.returncode == 0:
                  for node in json.loads(report.stdout).get('testNodes', []):
                      walk(node, '?', platform)

          # Test output can contain lines that read as workflow commands
          # (an early ::endgroup:: for one), so commands are off while it prints.
          token = secrets.token_hex(16)
          for label, text in details[:50]:
              print(f'::group::{label}')
              print(f'::stop-commands::{token}')
              print(text)
              print(f'::{token}::')
              print('::endgroup::')
          if len(details) > 50:
              print(f'{len(details) - 50} more failures, see the raw-test-output-apple artifact')

          try:
              run_status = int(open(root + '/run-status').read().strip())
          except (FileNotFoundError, ValueError):
              run_status = 1

          out = {
              'passed': passed,
              'failed': failed,
              'failures': failures[:50],
              'more_failures': max(0, len(failures) - 50),
              'run_status': run_status,
          }
          with open(root + '/test-results.json', 'w') as f:
              json.dump(out, f)
          print(json.dumps({k: v for k, v in out.items() if k != 'failures'}))
          EOF

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: apple-test-results
          path: ${{ runner.temp }}/apple-tests/test-results.json
          overwrite: true

      - name: Gate on failures
        if: always()
        run: |
          python3 - <<'EOF'
          import json
          import os
          import sys
          results = json.load(open(os.environ['RUNNER_TEMP'] + '/apple-tests/test-results.json'))
          sys.exit(1 if results['failed'] or results['run_status'] else 0)
          EOF

      # The result bundles, which hold the full logs and attachments. After the
      # gate, since the steps before it don't fail on a test failure.
      - name: Upload raw test output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: raw-test-output-apple
          path: ${{ runner.temp }}/apple-tests/*.xcresult
          overwrite: true
          if-no-files-found: ignore
          retention-days: 7

  # The one check a ruleset requires for the platform builds. A skipped job
  # passes, so a pull request with nothing planned reports success in seconds,
  # and a failed or cancelled one fails it.
  # In a run for a label that isn't ci:<platform>, plan is skipped and this
  # is too, under another name. A skipped check named build counts as passed
  # and could replace a failed one for the same commit.
  build:
    name: ${{ needs.plan.result == 'skipped' && 'build (label added, nothing to check)' || 'build' }}
    if: always() && needs.plan.result != 'skipped'
    needs: [plan, android, ios, macos, tvos, windows, windows-arm64, linux, web, apple-tests]
    runs-on: ubuntu-26.04
    steps:
      - name: Fail if any planned job failed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          results = {k: v['result'] for k, v in json.loads(os.environ['NEEDS']).items()}
          print(results)
          sys.exit(1 if any(r in ('failure', 'cancelled') for r in results.values()) else 0)
          EOF

  # What the PR Comment workflow reads to build its comment. always() keeps this
  # running when a platform job fails, which is the case the comment most needs
  # to report.
  save-pr-results:
    if: always() && github.event_name == 'pull_request' && needs.plan.result != 'skipped'
    needs: [plan, android, ios, macos, tvos, windows, windows-arm64, linux, web, apple-tests]
    runs-on: ubuntu-26.04
    steps:
      - name: Write outcomes.json
        run: |
          cat > outcomes.json <<EOF
          {
            "pr_number": ${{ github.event.pull_request.number }},
            "sha": "${{ github.event.pull_request.head.sha }}",
            "android": "${{ needs.android.result }}",
            "ios": "${{ needs.ios.result }}",
            "macos": "${{ needs.macos.result }}",
            "tvos": "${{ needs.tvos.result }}",
            "windows": "${{ needs.windows.result }}",
            "windows_arm64": "${{ needs.windows-arm64.result }}",
            "linux": "${{ needs.linux.result }}",
            "web": "${{ needs.web.result }}",
            "apple_tests": "${{ needs.apple-tests.result }}",
            "planned": {
              "android": ${{ needs.plan.outputs.android == 'true' }},
              "ios": ${{ needs.plan.outputs.ios == 'true' }},
              "macos": ${{ needs.plan.outputs.macos == 'true' }},
              "tvos": ${{ needs.plan.outputs.tvos == 'true' }},
              "windows": ${{ needs.plan.outputs.windows == 'true' }},
              "windows_arm64": ${{ needs.plan.outputs.windows_arm64 == 'true' }},
              "linux": ${{ needs.plan.outputs.linux == 'true' }},
              "web": ${{ needs.plan.outputs.web == 'true' }},
              "apple_tests": ${{ needs.plan.outputs.apple_tests == 'true' }}
            }
          }
          EOF

      - uses: actions/upload-artifact@v6
        with:
          name: build-results
          path: outcomes.json

  # GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, ios, macos, tvos, windows, windows-arm64, linux]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: Moonfin_*
          generate_release_notes: true
